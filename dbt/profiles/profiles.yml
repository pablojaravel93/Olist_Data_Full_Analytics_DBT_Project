olist:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: oauth                 # uses your ADC from section 1.1
      project: olist-analytics-501518 #GCP project name
      dataset: dbt_pjaramillo
      location: US
      threads: 4
      maximum_bytes_billed: 10737418240   # 10 GB cap per query - cost guardrail
    prod:
      type: bigquery
      method: oauth                 # in Cloud Run, ADC = the job's service account
      project: olist-analytics-501518
      dataset: analytics
      location: US
      threads: 8
      priority: interactive
      maximum_bytes_billed: 10737418240   # 10 GB cap per query - cost guardrail