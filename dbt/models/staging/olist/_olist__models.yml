version: 2

models:
  - name: stg_olist__orders
    description: "One row per order. Filtered by the as_of_date visibility cursor."
    columns:
      - name: order_id
        description: "Primary key — one row per order."
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: "FK to stg_olist__customers (per-order customer key)."
        data_tests:
          - not_null
      - name: order_status
        data_tests:
          - accepted_values:
              values: [delivered, shipped, canceled, unavailable, invoiced, processing, approved, created]

  - name: stg_olist__customers
    description: "One row per customer_id (per-order key). customer_unique_id identifies the actual person and repeats across orders."
    columns:
      - name: customer_id
        description: "Primary key."
        data_tests:
          - unique
          - not_null
      - name: customer_unique_id
        description: "The real person; intentionally NOT unique here."
        data_tests:
          - not_null

  - name: stg_olist__order_items
    description: "One row per item within an order. Grain = order_id + order_item_id."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - order_id
            - order_item_id
    columns:
      - name: order_id
        data_tests: [not_null]
      - name: order_item_id
        data_tests: [not_null]
      - name: product_id
        data_tests: [not_null]
      - name: seller_id
        data_tests: [not_null]

  - name: stg_olist__payments
    description: "One row per payment on an order. Grain = order_id + payment_sequential."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - order_id
            - payment_sequential
    columns:
      - name: order_id
        data_tests: [not_null]
      - name: payment_type
        data_tests:
          - accepted_values:
              values: [credit_card, boleto, voucher, debit_card, not_defined]

  - name: stg_olist__reviews
    description: "One row per review_id, deduplicated in staging (raw has duplicate review ids)."
    columns:
      - name: review_id
        description: "Primary key — unique after staging dedup."
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_tests: [not_null]
      - name: review_score
        data_tests:
          - accepted_values:
              values: [1, 2, 3, 4, 5]
              quote: false

  - name: stg_olist__products
    description: "One row per product. Source 'lenght' typos corrected to 'length'."
    columns:
      - name: product_id
        description: "Primary key."
        data_tests:
          - unique
          - not_null

  - name: stg_olist__sellers
    description: "One row per seller."
    columns:
      - name: seller_id
        description: "Primary key."
        data_tests:
          - unique
          - not_null

  - name: stg_olist__geolocation
    description: "Multiple rows per zip code prefix (one per lat/lng point) — no unique key by design."
    columns:
      - name: geolocation_zip_code_prefix
        data_tests:
          - not_null

  - name: stg_olist__category_translation
    description: "Portuguese -> English product category mapping. Columns aliased from string_field_0/1."
    columns:
      - name: product_category_name
        description: "Primary key."
        data_tests:
          - unique
          - not_null
      - name: product_category_name_english
        data_tests:
          - not_null
